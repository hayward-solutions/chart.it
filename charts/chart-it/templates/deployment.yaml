apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart-it.fullname" . }}
  labels:
    {{- include "chart-it.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart-it.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart-it.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "chart-it.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: chart-it
          image: {{ include "chart-it.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CHARTIT_ADDR
              value: ":8080"
            - name: CHARTIT_DATA_DIR
              value: "/data"
            - name: CHARTIT_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- with .Values.config.baseUrl }}
            - name: CHARTIT_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.maxDocumentBytes }}
            - name: CHARTIT_MAX_DOCUMENT_BYTES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.oidc.issuer }}
            - name: CHARTIT_OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.oidc.clientId }}
            - name: CHARTIT_OIDC_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.oidc.scopes }}
            - name: CHARTIT_OIDC_SCOPES
              value: {{ . | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "chart-it.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
