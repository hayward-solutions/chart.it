nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/hayward-solutions/chart.it
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

config:
  baseUrl: ""
  logLevel: info
  maxDocumentBytes: ""
  oidc:
    issuer: ""
    clientId: ""
    scopes: "openid profile email"

env: {}

existingSecret: ""

persistence:
  enabled: true
  storageClass: ""
  size: 2Gi
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-it.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

tmpSizeLimit: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
