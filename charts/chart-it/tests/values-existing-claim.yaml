persistence:
  existingClaim: chart-it-data
env:
  CHARTIT_MAX_DOCUMENT_BYTES: "10485760"
  CHARTIT_ALLOW_TEST_AUTH: "1"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: chart-it.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: chart-it-tls
      hosts:
        - chart-it.example.com
