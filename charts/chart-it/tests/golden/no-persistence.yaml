---
# Source: chart-it/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: chart-it-diagrams
  labels:
    helm.sh/chart: chart-it-0.1.0
    app.kubernetes.io/name: diagrams
    app.kubernetes.io/instance: chart-it
    app.kubernetes.io/version: "main"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: diagrams
    app.kubernetes.io/instance: chart-it
---
# Source: chart-it/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-it-diagrams
  labels:
    helm.sh/chart: chart-it-0.1.0
    app.kubernetes.io/name: diagrams
    app.kubernetes.io/instance: chart-it
    app.kubernetes.io/version: "main"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: diagrams
      app.kubernetes.io/instance: chart-it
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagrams
        app.kubernetes.io/instance: chart-it
      annotations:
        example.com/scrape: "false"
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chart-it
          image: "ghcr.io/hayward-solutions/chart.it:main"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CHARTIT_ADDR
              value: ":8080"
            - name: CHARTIT_DATA_DIR
              value: "/data"
            - name: CHARTIT_LOG_LEVEL
              value: "info"
            - name: CHARTIT_OIDC_SCOPES
              value: "openid profile email"
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: "64Mi"
      nodeSelector:
        kubernetes.io/arch: arm64
