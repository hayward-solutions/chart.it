name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hayward-solutions/chart.it
  HELM_VERSION: v4.1.1

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifests:
    name: Publish multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" "${IMAGE}:latest-arm64"

  scan:
    name: Trivy scan
    needs: manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  chart:
    name: Publish Helm chart
    needs: manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
      - name: Package chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${version}/" charts/chart-it/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" charts/chart-it/Chart.yaml
          helm package charts/chart-it --destination .helm-packages
      - name: Push chart
        run: |
          for pkg in .helm-packages/*.tgz; do
            helm push "$pkg" "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts"
          done

  release:
    name: GitHub release
    needs: [scan, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
