name: Merge
run-name: Merge ${{ github.ref_name }} - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]

concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hayward-solutions/chart.it
  HELM_VERSION: v4.1.1

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute version
        id: vars
        run: echo "version=main-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          push: true
          provenance: false
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ env.IMAGE }}:main-${{ matrix.arch }}
            ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifests:
    name: Publish multi-arch manifests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:main" \
            -t "${IMAGE}:main-${GITHUB_SHA::8}" \
            "${IMAGE}:main-amd64" "${IMAGE}:main-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" "${IMAGE}:${GITHUB_SHA}-arm64"

  scan:
    name: Trivy scan
    needs: manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  chart:
    name: Publish Helm chart
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
      - name: Package chart
        run: |
          sed -i "s/^version:.*/version: 0.0.0-main+${GITHUB_SHA::8}/" charts/chart-it/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"main-${GITHUB_SHA::8}\"/" charts/chart-it/Chart.yaml
          helm package charts/chart-it --destination .helm-packages
      - name: Push chart
        run: |
          for pkg in .helm-packages/*.tgz; do
            helm push "$pkg" "oci://${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/charts"
          done
