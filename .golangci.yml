version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - unused
    - ineffassign
    - misspell
    - staticcheck
    - gosec

  settings:
    errcheck:
      exclude-functions:
        - io.Closer.Close
        - (net/http.ResponseWriter).Write
    gosec:
      excludes:
        - G104
        - G115

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
